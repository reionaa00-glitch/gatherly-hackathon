spot(){return head("Spotted","Seen something thrown away that could become a project? Tell everyone where it is before it’s gone. Students and teachers can post.")+`<div class="cards">${all("spot").map(x=>{const t=ix(x.id).taken;return`<article class="cd">${x.photo||x.tx?art(x):""}<div class="bd"><div><span class="tag ${t?"":"l"}">${t?"Taken":"Still there"}</span></div><h3>${esc(x.item)}</h3><div class="m">📍 ${esc(x.where)}<br>${esc(x.who||x.by)}${x.role==="Teacher"?" (teacher)":""} ${ago(x.at)}</div><p>${esc(x.note)}</p><div class="acts">${t?"":`<button class="btn s" data-a="taken" data-id="${x.id}">Mark as taken</button>`}${own(x)}</div></div></article>`}).join("")||empty("Nothing posted yet.")}</div>`},

function shrink(f){return new Promise((resolve,reject)=>{if(!f||!f.size)return resolve("");if(!f.type.startsWith("image/"))return reject(new Error("Choose an image file."));const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{try{const s=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;const ctx=c.getContext("2d");if(!ctx)throw new Error("Image processing is unavailable.");ctx.drawImage(i,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.7))}catch(e){reject(e)}finally{URL.revokeObjectURL(u)}};i.onerror=()=>{URL.revokeObjectURL(u);reject(new Error("The selected image could not be opened."))};i.src=u})}

else if(a==="rate"){put(id,x=>{x.rt=x.rt||{};x.rt[uid]=+b.dataset.n;return x});toast("Thanks, your rating is saved")}

else if(a==="taken"){put(id,x=>{x.taken=1;return x})}else if(a==="gone"){put(id,x=>{x.gone=1;return x})}});

else if(a==="post"){const file=f.photo&&f.photo.files[0];delete d.photo;d.k=f.dataset.k;try{if(file)d.photo=await shrink(file)}catch(err){toast(err.message);return}if(d.k==="nav"||d.k==="past"||d.k==="rate")d.e="🛠️";S.form=false;const saved=await add(d);toast(saved?"Posted!":"Posted for now, but could not save it in this browser. Free up storage and try again.")}});
